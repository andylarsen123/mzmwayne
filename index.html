<!-- Put this inside your master container where the map goes -->
<div id="tableau-facade" style="position: relative; cursor: pointer; text-align: center;" onclick="loadTableauMap()">
  <!-- Shows the static image first -->
  <img src="https://public.tableau.com/static/images/Mi/MichiganZoningMAPv1_0/MZM1_0/1.png" style="max-width: 100%; height: auto; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1);" alt="Click to load interactive map">
  
  <!-- A fake button layered over the image -->
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0055a4; color: white; padding: 15px 30px; font-family: 'Montserrat', sans-serif; font-weight: bold; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    Load Interactive Map
  </div>
</div>

<!-- The empty container waiting for the map -->
<div id="actual-tableau-container" style="display: none;"></div>

<script>
function loadTableauMap() {
  // Hide the image, show the map container
  document.getElementById('tableau-facade').style.display = 'none';
  document.getElementById('actual-tableau-container').style.display = 'block';
  
  // Inject the Tableau embed code dynamically
  document.getElementById('actual-tableau-container').innerHTML = `
    <div class='tableauPlaceholder' id='viz1788372923354' style='position: relative'>
      <object class='tableauViz' style='display:none;'>
        <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' /> 
        <param name='embed_code_version' value='3' /> 
        <param name='site_root' value='' />
        <param name='name' value='MichiganZoningMAPv1_0&#47;MZM1_0' />
        <param name='tabs' value='no' />
        <param name='toolbar' value='no' /> <!-- Turned off to save load time -->
        <param name='animate_transition' value='no' /> <!-- Turned off to save load time -->
        <param name='display_static_image' value='yes' />
        <param name='display_spinner' value='yes' />
        <param name='display_overlay' value='yes' />
        <param name='display_count' value='yes' />
        <param name='language' value='en-US' />
        <param name='filter' value='County=Wayne' /> 
      </object>
    </div>
  `;

  // Run the Tableau API
  var divElement = document.getElementById('viz1788372923354');                    
  var vizElement = divElement.getElementsByTagName('object')[0];                    
  if ( divElement.offsetWidth > 800 ) { vizElement.style.width='100%';vizElement.style.height='1027px'; } 
  else if ( divElement.offsetWidth > 500 ) { vizElement.style.width='100%';vizElement.style.height='1027px'; } 
  else { vizElement.style.width='100%';vizElement.style.height='1877px'; }                     
  var scriptElement = document.createElement('script');                    
  scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';                    
  vizElement.parentNode.insertBefore(scriptElement, vizElement); 
}
</script>
